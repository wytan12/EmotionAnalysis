<app-header></app-header>
<app-reflection-title (titleSelected)="handleTitleSelected($event)"></app-reflection-title>
<app-select-member-dropdown (userSelected)="onUserSelected($event)"></app-select-member-dropdown>

<div class="form-container">
  <div class="left-section">
    <!-- Left Question Block -->
    <div class="question-block blue-bg">
      <h2 class="question-block-heading">Our Analysis</h2>
      <label>Which positive emotion do you see the most in the charts?</label>
      <textarea name="q1" rows="5" maxlength="1000" [(ngModel)]="formData.PositiveEmotion"></textarea>

      <label>Which negative emotion do you see the most in the charts?</label>
      <textarea name="q2" rows="5" maxlength="1000" [(ngModel)]="formData.NegativeEmotion"></textarea>
    </div>
  </div>

  <div class="right-section">
    <!-- Right Question Block -->
    <div class="question-block blue-bg">
      <h2 class="question-block-heading">Our Regulation</h2>
      <label>Choose 1 strategy to maintain the positive emotion</label>
      <textarea name="q3" rows="5" maxlength="1000" [(ngModel)]="formData.PositiveStrategy"></textarea>

      <label>Choose 1 strategy to overcome the negative emotion</label>
      <textarea name="q4" rows="5" maxlength="1000" [(ngModel)]="formData.NegativeStrategy"></textarea>
    </div>
  </div>
</div>

<div class="submit-block" [ngClass]="{'disabled-button': !(selectedTitle?.trim()?.length)}">
  <input
    type="button"
    value="Submit"
    (click)="onSubmitClick()"
    [disabled]="!(selectedTitle && selectedTitle.trim().length)"
  />
</div>
